<text x="675" y="132" font-family="Arial,sans-serif" font-size="17" fill="#172b42" text-anchor="start">Observed stress (Pa), seed 29 / xy</text>
<text x="35" y="545" font-family="Arial,sans-serif" font-size="17" fill="#172b42" text-anchor="start">Left: each line is one seed, with its two directions averaged. Four synthetic seeds; no biological confidence interval.</text>
<text x="35" y="578" font-family="Arial,sans-serif" font-size="17" fill="#172b42" text-anchor="start">Right: 10% assumed fiber rupture, 30% angular locks. Dashed curves do not pass the strict positive-curvature tier.</text>
<text x="35" y="611" font-family="Arial,sans-serif" font-size="17" fill="#172b42" text-anchor="start">A maximum at the 50% shear cap is censored. Work through the cap is not fracture toughness or a phase transition.</text>
<text x="35" y="660" font-family="Arial,sans-serif" font-size="18" fill="#172b42" text-anchor="start">Recovered 160/160 final cases · complete 160 · paired numerical gates: 0 strict / 58 conditional</text>
<text x="35" y="697" font-family="Arial,sans-serif" font-size="17" fill="#172b42" text-anchor="start">Same graph, selected-site counts, degree counts, active-angle counts and total angular stiffness within each placement pair.</text>
<text x="35" y="734" font-family="Arial,sans-serif" font-size="17" fill="#172b42" text-anchor="start">Bovine calibration constrains the baseline bulk response. Topology, angular locking and rupture remain hypotheses.</text>
<text x="35" y="780" font-family="Arial,sans-serif" font-size="16" fill="#172b42" text-anchor="start">See the interactive explorer and raw source archive for every trajectory, failed gate and selected-state Hessian check.</text>
