<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1110" viewBox="0 0 1200 1110" role="img" aria-labelledby="title desc"><title id="title">Seven mechanisms, seven distinct tests</title><desc id="desc">A diagram of the new collagen transition study. Six and seven are declared statistical and feedback hypotheses. None of the models are tissue-calibrated.</desc><rect width="1200" height="1110" fill="#f5f3eb"/><style>text{font-family:Arial,sans-serif;fill:#233645}.title{font-size:34px;font-weight:700}.small{font-size:17px}.heading{font-size:24px;font-weight:700}.label{font-size:17px;font-weight:700;fill:#007f86}.caveat{font-size:16px;fill:#77513c}</style><text x="45" y="58" class="title">Seven mechanisms. Separate tests. Explicit limits.</text><text x="45" y="90" class="small">Collagen transition study · finite 2D mechanics + declared statistical and feedback models</text><rect x="40" y="120" width="1120" height="116" rx="12" fill="white" stroke="#d7dfda"/><rect x="40" y="120" width="64" height="116" rx="12" fill="#007f86"/><text x="72" y="184" text-anchor="middle" style="fill:white;font-size:27px;font-weight:bold">01</text><text x="126" y="149" class="heading">Strain-driven rigidity</text><text x="126" y="178" class="small">Control: Connectivity + bending + shear strain</text><text x="650" y="178" class="label">Readout: Tangent stiffness and nonaffine motion</text><text x="126" y="212" class="caveat">Finite-network crossover; no critical exponent</text><rect x="40" y="250" width="1120" height="116" rx="12" fill="white" stroke="#d7dfda"/><rect x="40" y="250" width="64" height="116" rx="12" fill="#007f86"/><text x="72" y="314" text-anchor="middle" style="fill:white;font-size:27px;font-weight:bold">02</text><text x="126" y="279" class="heading">Sliding and locking</text><text x="126" y="308" class="small">Control: Same initial graph and spring modulus</text><text x="650" y="308" class="label">Readout: Stress retention, plastic dissipation, rupture</text><text x="126" y="342" class="caveat">Locking is an assumed mobility, not AGE dose</text><rect x="40" y="380" width="1120" height="116" rx="12" fill="white" stroke="#d7dfda"/><rect x="40" y="380" width="64" height="116" rx="12" fill="#007f86"/><text x="72" y="444" text-anchor="middle" style="fill:white;font-size:27px;font-weight:bold">03</text><text x="126" y="409" class="heading">Placement and damage</text><text x="126" y="438" class="small">Control: Stiffen bonds or progressively cut them</text><text x="650" y="438" class="label">Readout: Small-strain modulus; retained tension</text><text x="126" y="472" class="caveat">Graph connectivity alone is not mechanical rigidity</text><rect x="40" y="510" width="1120" height="116" rx="12" fill="white" stroke="#d7dfda"/><rect x="40" y="510" width="64" height="116" rx="12" fill="#007f86"/><text x="72" y="574" text-anchor="middle" style="fill:white;font-size:27px;font-weight:bold">04</text><text x="126" y="539" class="heading">Compression with inclusions</text><text x="126" y="568" class="small">Control: Change finite-disk area fraction</text><text x="650" y="568" class="label">Readout: Contact count and compression reaction</text><text x="126" y="602" class="caveat">2D disk contacts; not physiological pressure</text><rect x="40" y="640" width="1120" height="116" rx="12" fill="white" stroke="#d7dfda"/><rect x="40" y="640" width="64" height="116" rx="12" fill="#007f86"/><text x="72" y="704" text-anchor="middle" style="fill:white;font-size:27px;font-weight:bold">05</text><text x="126" y="669" class="heading">Plastic memory</text><text x="126" y="698" class="small">Control: Vary peak strain and holding time</text><text x="650" y="698" class="label">Readout: Residual strain after unloading</text><text x="126" y="732" class="caveat">Irreversible rest-length growth is phenomenological</text><rect x="40" y="770" width="1120" height="116" rx="12" fill="white" stroke="#d7dfda"/><rect x="40" y="770" width="64" height="116" rx="12" fill="#007f86"/><text x="72" y="834" text-anchor="middle" style="fill:white;font-size:27px;font-weight:bold">06</text><text x="126" y="799" class="heading">Thermal sensitivity</text><text x="126" y="828" class="small">Control: Change assumed stabilization coefficients</text><text x="650" y="828" class="label">Readout: Exact finite-chain folded fraction</text><text x="126" y="862" class="caveat">No atomistic MD or temperature in Celsius</text><rect x="40" y="900" width="1120" height="116" rx="12" fill="white" stroke="#d7dfda"/><rect x="40" y="900" width="64" height="116" rx="12" fill="#007f86"/><text x="72" y="964" text-anchor="middle" style="fill:white;font-size:27px;font-weight:bold">07</text><text x="126" y="929" class="heading">Hypothetical LOX feedback</text><text x="126" y="958" class="small">Control: Vary production gain and coupling</text><text x="650" y="958" class="label">Readout: Equilibria, stability, hysteresis</text><text x="126" y="992" class="caveat">Mathematical model; no fitted biological switch</text><text x="45" y="1066" class="small">Every sampled mechanical state retains its convergence flag. Failed samples remain in the raw archive.</text><text x="45" y="1092" class="small">A successful numerical check does not validate collagen chemistry, tissue toughness, or extreme-load tolerance.</text></svg>
