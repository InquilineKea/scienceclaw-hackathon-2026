<text x="30" y="557" fill="#172b42" font-family="Arial,sans-serif" font-size="18" text-anchor="start">Harmonic interpolation beats the selected isotropic elastic baseline. Displacement input is supplied only at known nodes.</text>
<text x="30" y="592" fill="#172b42" font-family="Arial,sans-serif" font-size="17" text-anchor="start">No inverse-model cell forces are used as targets. Absolute stiffness cancels from the homogeneous Dirichlet operator.</text>
<text x="30" y="627" fill="#172b42" font-family="Arial,sans-serif" font-size="17" text-anchor="start">Raw P1 strains amplify image-correlation noise. Post-test 61×61×59 µm averaging retains 303 complete guarded stencils:</text>
<text x="30" y="660" fill="#172b42" font-family="Arial,sans-serif" font-size="17" text-anchor="start">averaged strain NRMSE: harmonic 0.605; elastic 0.658. No model reselection.</text>
<text x="30" y="704" fill="#172b42" font-family="Arial,sans-serif" font-size="16" text-anchor="start">This is an internal measured-field test on a PIV sampling mesh; measured fiber connectivity and matched specimen rheology remain missing.</text>
<text x="30" y="745" fill="#172b42" font-family="Arial,sans-serif" font-size="16" text-anchor="start">Source: public Saenopy ClassicSingleCellTFM v0.7.4 images/PIV fields, linked to Böhringer et al. (2024).</text>
